<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Criminal Law Academy - ณัฐพล บัวทอง</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;800&display=swap');
        body { font-family: 'Sarabun', sans-serif; }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // ไอคอนแบบ SVG (เพื่อให้โหลดได้ 100% ไม่ต้องพึ่งไฟล์นอก)
        const IconGavel = () => <svg className="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3" /></svg>;
        const IconBook = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>;

        const CriminalLawGame = () => {
            const [activeTab, setActiveTab] = useState('intro');
            const [score, setScore] = useState(0);
            const [showAnswer, setShowAnswer] = useState(false);
            const [currentQuiz, setCurrentQuiz] = useState(0);

            const quizData = [
                {
                    id: 1,
                    question: "แดงนอนละเมอถีบภรรยาตกเตียงแขนหัก โดยที่แดงไม่เคยรู้มาก่อนว่าตนเองมีอาการนี้",
                    options: [
                        { text: "ผิดฐานทำร้ายร่างกาย", correct: false, reason: "ไม่ใช่! เพราะขาดองค์ประกอบ 'การกระทำ' (ไม่ได้คิดและตกลงใจ)" },
                        { text: "ไม่ผิดเลย เพราะไม่มีการกระทำ", correct: true, reason: "ถูกต้อง! การละเมอโดยไม่รู้ตัว = ร่างกายเคลื่อนไหวแต่จิตใจไม่ได้สั่ง = ไม่มีการกระทำ" }
                    ]
                },
                {
                    id: 2,
                    question: "แดงรู้ตัวว่าเมาแล้วชอบละเมอชกต่อย แต่ก็ยังกินเหล้าแล้วไปนอนข้างดำ สุดท้ายละเมอต่อยดำจริงๆ",
                    options: [
                        { text: "ผิด! เพราะรู้ตัวล่วงหน้า (Free in Cause)", correct: true, reason: "เยี่ยมมาก! แม้ตอนต่อยจะไม่รู้ตัว แต่เหตุเกิดจากการกระทำตอนมีสติ (กินเหล้า+ไปนอนข้างเขา)" },
                        { text: "ไม่ผิด เพราะตอนต่อยไม่รู้ตัว", correct: false, reason: "ผิด! กรณีนี้เข้าข่ายทฤษฎี Free in Cause (การกระทำโดยอิสระในขณะเป็นต้นเหตุ)" }
                    ]
                },
                {
                    id: 3,
                    question: "Lifeguard เห็นคนจมน้ำแล้วยืนมองเฉยๆ เพราะหมั่นไส้ (อยากให้ตาย) จนเขาตายจริงๆ",
                    options: [
                        { text: "ผิดฐานละเว้น (ลหุโทษ)", correct: false, reason: "เบาไป! Lifeguard มีหน้าที่เฉพาะ การนิ่งเฉยถือเป็นการฆ่า" },
                        { text: "ผิดฐานฆ่าคนตายโดยเจตนา (งดเว้น)", correct: true, reason: "ถูกต้อง! นี่คือการ 'งดเว้น' เพราะเขามีหน้าที่ป้องกันผล การไม่ทำ = การลงมือฆ่า" }
                    ]
                }
            ];

            const handleAnswer = (isCorrect) => {
                setShowAnswer(true);
                if (isCorrect) setScore(score + 1);
            };

            const nextQuiz = () => {
                if (currentQuiz < quizData.length - 1) {
                    setCurrentQuiz(currentQuiz + 1);
                    setShowAnswer(false);
                } else {
                    setActiveTab('summary');
                }
            };

            const renderContent = () => {
                switch (activeTab) {
                    case 'intro':
                        return (
                            <div className="flex flex-col items-center justify-center p-8 text-center space-y-6 animate-fade-in">
                                <div className="w-24 h-24 bg-yellow-400 rounded-full flex items-center justify-center shadow-lg mb-4">
                                    <IconGavel />
                                </div>
                                <h1 className="text-3xl md:text-4xl font-bold text-gray-800">ยินดีต้อนรับสู่ "ศาลอาญาคาเฟ่" ⚖️</h1>
                                <p className="text-lg text-gray-600">มาเรียนรู้เรื่อง <strong>"การกระทำ (The Act)"</strong> โดย ณัฐพล บัวทอง</p>
                                <button onClick={() => setActiveTab('definition')} className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition transform hover:scale-105">
                                    เริ่มบทเรียน: การกระทำคืออะไร?
                                </button>
                            </div>
                        );
                    case 'definition':
                        return (
                            <div className="space-y-6 p-6 animate-fade-in">
                                <h2 className="text-3xl font-bold text-blue-800">💭 สูตรลับ: 3 สเต็ปเทพ</h2>
                                <div className="bg-white p-6 rounded-xl shadow-md border-l-4 border-blue-500">
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-center">
                                        <div className="p-4 bg-blue-50 rounded-lg"><span className="text-4xl">💭</span><h3 className="font-bold">1. คิด</h3></div>
                                        <div className="p-4 bg-green-50 rounded-lg"><span className="text-4xl">💡</span><h3 className="font-bold">2. ตกลงใจ</h3></div>
                                        <div className="p-4 bg-red-50 rounded-lg"><span className="text-4xl">🏃</span><h3 className="font-bold">3. กระทำ</h3></div>
                                    </div>
                                </div>
                                <button onClick={() => setActiveTab('omission')} className="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold">ต่อไป: งดเว้น vs ละเว้น ➡️</button>
                            </div>
                        );
                    case 'omission':
                        return (
                            <div className="space-y-6 p-6 animate-fade-in">
                                <h2 className="text-3xl font-bold text-purple-800 text-center">งดเว้น vs ละเว้น</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="bg-red-50 p-6 rounded-xl border-2 border-red-200">
                                        <h3 className="font-bold text-red-800 text-xl mb-2">งดเว้น (หน้าที่เฉพาะ)</h3>
                                        <p className="text-sm">เช่น พ่อแม่เลี้ยงลูก, Lifeguard</p>
                                        <p className="mt-2 font-bold text-red-600">โดนข้อหาเหมือนฆ่าเอง!</p>
                                    </div>
                                    <div className="bg-green-50 p-6 rounded-xl border-2 border-green-200">
                                        <h3 className="font-bold text-green-800 text-xl mb-2">ละเว้น (หน้าที่ทั่วไป)</h3>
                                        <p className="text-sm">เช่น คนเดินผ่านเห็นคนตกน้ำ</p>
                                        <p className="mt-2 font-bold text-green-600">โทษเบา (ลหุโทษ)</p>
                                    </div>
                                </div>
                                <button onClick={() => setActiveTab('quiz')} className="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold shadow-lg animate-bounce">พร้อมลุยด่านทดสอบ! ⚔️</button>
                            </div>
                        );
                    case 'quiz':
                        const quiz = quizData[currentQuiz];
                        return (
                            <div className="max-w-2xl mx-auto p-6 animate-fade-in">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-xl font-bold text-gray-800">คดีที่ {currentQuiz + 1} / {quizData.length}</h2>
                                    <span className="bg-blue-100 text-blue-800 px-4 py-1 rounded-full font-bold">คะแนน: {score}</span>
                                </div>
                                <div className="bg-white p-8 rounded-2xl shadow-xl border-t-8 border-indigo-500">
                                    <p className="text-xl font-medium text-gray-800 mb-6">{quiz.question}</p>
                                    {!showAnswer ? (
                                        <div className="space-y-4">
                                            {quiz.options.map((option, idx) => (
                                                <button key={idx} onClick={() => handleAnswer(option.correct)} className="w-full text-left p-4 rounded-lg border-2 border-gray-100 hover:border-indigo-500 hover:bg-indigo-50 transition font-medium">
                                                    {option.text}
                                                </button>
                                            ))}
                                        </div>
                                    ) : (
                                        <div className="p-4 bg-yellow-50 rounded-lg">
                                            <p className="font-bold text-indigo-800 mb-2">คำตัดสิน:</p>
                                            <p className="text-gray-700 mb-4">{quiz.options.find(o => o.correct).reason}</p>
                                            <button onClick={nextQuiz} className="w-full bg-indigo-600 text-white py-2 rounded-lg font-bold">คดีต่อไป ➡️</button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        );
                    case 'summary':
                        return (
                            <div className="text-center p-8 space-y-6 animate-fade-in">
                                <h2 className="text-4xl font-bold text-indigo-800">🎉 จบหลักสูตร! 🎉</h2>
                                <p className="text-2xl font-bold text-gray-700">คุณได้คะแนน {score} / 3</p>
                                <button onClick={() => {setScore(0); setCurrentQuiz(0); setShowAnswer(false); setActiveTab('intro');}} className="bg-gray-800 text-white px-8 py-3 rounded-full hover:bg-black">กลับหน้าแรก 🔄</button>
                            </div>
                        );
                    default: return null;
                }
            };

            return (
                <div className="max-w-4xl mx-auto">
                    <nav className="bg-white shadow-md p-4 sticky top-0 z-50 flex justify-between items-center rounded-b-xl">
                        <div className="flex items-center gap-2 font-bold text-indigo-700 text-xl cursor-pointer" onClick={() => setActiveTab('intro')}>
                            <IconBook /> <span>Law Academy</span>
                        </div>
                    </nav>
                    <main className="mt-8">{renderContent()}</main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CriminalLawGame />);
    </script>
</body>
</html>
