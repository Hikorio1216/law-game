<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Law Game - Nattapon Buathong</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap');
        
        body { 
            font-family: 'Prompt', sans-serif; 
            background-color: #f8fafc; /* สีฟ้าจางๆ สไตล์มินิมอล */
            -webkit-tap-highlight-color: transparent; 
        }
        
        .animate-fade-in { 
            animation: fadeIn 0.4s ease-out; 
        }
        
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* ตกแต่งปุ่มให้ดูแพง */
        .btn-minimal {
            transition: all 0.2s ease;
            border: 1px solid #e2e8f0;
        }
        .btn-minimal:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Icon Helper ที่เสถียรขึ้น
        const Icon = ({ name, size = 24, className = "" }) => {
            const LucideIcon = window.lucide[name];
            return LucideIcon ? <LucideIcon size={size} className={className} /> : null;
        };

        const CriminalLawGame = () => {
            const [activeTab, setActiveTab] = useState('intro');
            const [score, setScore] = useState(0);
            const [showAnswer, setShowAnswer] = useState(false);
            const [currentQuiz, setCurrentQuiz] = useState(0);

            const quizData = [
                {
                    id: 1,
                    question: "แดงนอนละเมอถีบภรรยาตกเตียงแขนหัก โดยที่แดงไม่เคยรู้มาก่อนว่าตนเองมีอาการนี้",
                    options: [
                        { text: "ผิดฐานทำร้ายร่างกาย", correct: false, reason: "ไม่ใช่! เพราะขาดองค์ประกอบ 'การกระทำ' (ไม่ได้คิดและตกลงใจ)" },
                        { text: "ไม่ผิดเลย เพราะไม่มีการกระทำ", correct: true, reason: "ถูกต้อง! การละเมอโดยไม่รู้ตัว = ร่างกายเคลื่อนไหวแต่จิตใจไม่ได้สั่ง = ไม่มีการกระทำ" }
                    ]
                },
                {
                    id: 2,
                    question: "แดงรู้ตัวว่าเมาแล้วชอบละเมอชกต่อย แต่ก็ยังกินเหล้าแล้วไปนอนข้างดำ สุดท้ายละเมอต่อยดำจริงๆ",
                    options: [
                        { text: "ผิด! เพราะรู้ตัวล่วงหน้า (Free in Cause)", correct: true, reason: "เยี่ยมมาก! แม้ตอนต่อยจะไม่รู้ตัว แต่เหตุเกิดจากการกระทำตอนมีสติ (กินเหล้า+ไปนอนข้างเขา)" },
                        { text: "ไม่ผิด เพราะตอนต่อยไม่รู้ตัว", correct: false, reason: "ผิด! กรณีนี้เข้าข่ายทฤษฎี Free in Cause" }
                    ]
                },
                {
                    id: 3,
                    question: "Lifeguard เห็นคนจมน้ำแล้วยืนมองเฉยๆ เพราะหมั่นไส้ (อยากให้ตาย) จนเขาตายจริงๆ",
                    options: [
                        { text: "ผิดฐานละเว้น (ลหุโทษ)", correct: false, reason: "เบาไป! Lifeguard มีหน้าที่เฉพาะ การนิ่งเฉยถือเป็นการฆ่า" },
                        { text: "ผิดฐานฆ่าคนตายโดยเจตนา (งดเว้น)", correct: true, reason: "ถูกต้อง! นี่คือการ 'งดเว้น' เพราะเขามีหน้าที่ป้องกันผล" }
                    ]
                }
            ];

            const handleAnswer = (isCorrect) => {
                setShowAnswer(true);
                if (isCorrect) setScore(score + 1);
            };

            const nextQuiz = () => {
                if (currentQuiz < quizData.length - 1) {
                    setCurrentQuiz(currentQuiz + 1);
                    setShowAnswer(false);
                } else {
                    setActiveTab('summary');
                }
            };

            const renderContent = () => {
                switch (activeTab) {
                    case 'intro':
                        return (
                            <div className="flex flex-col items-center justify-center p-12 text-center space-y-8 animate-fade-in">
                                <div className="w-24 h-24 bg-indigo-600 rounded-3xl flex items-center justify-center shadow-xl mb-4 rotate-3">
                                    <Icon name="Gavel" size={48} className="text-white" />
                                </div>
                                <div>
                                    <h1 className="text-3xl font-bold text-slate-800 mb-2">ศาลอาญาคาเฟ่</h1>
                                    <p className="text-slate-500 font-light italic">Criminal Law Academy</p>
                                </div>
                                <div className="space-y-2">
                                    <p className="text-slate-600">โดยคุณ ณัฐพล บัวทอง</p>
                                    <p className="text-sm text-slate-400">เรียนรู้หลักกฎหมายผ่านสถานการณ์จำลอง</p>
                                </div>
                                <button 
                                    onClick={() => setActiveTab('definition')}
                                    className="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-4 px-10 rounded-2xl shadow-lg transition-all active:scale-95"
                                >
                                    เริ่มเรียนรู้
                                </button>
                            </div>
                        );

                    case 'definition':
                        return (
                            <div className="space-y-6 p-8 animate-fade-in overflow-y-auto">
                                <h2 className="text-2xl font-bold text-indigo-900 flex items-center gap-2">
                                    <Icon name="Brain" className="text-indigo-500" /> หลักการกระทำ
                                </h2>
                                <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
                                    <p className="text-slate-600 mb-6 leading-relaxed">การกระทำทางกฎหมายอาญาต้องครบ **3 องค์ประกอบ** ถึงจะเรียกว่ามีการกระทำ:</p>
                                    <div className="space-y-4">
                                        <div className="flex items-center gap-4 p-4 bg-slate-50 rounded-2xl border border-slate-100">
                                            <span className="text-xl">💭</span>
                                            <span className="font-medium">1. คิด (Thinking)</span>
                                        </div>
                                        <div className="flex items-center gap-4 p-4 bg-slate-50 rounded-2xl border border-slate-100">
                                            <span className="text-xl">💡</span>
                                            <span className="font-medium">2. ตกลงใจ (Deciding)</span>
                                        </div>
                                        <div className="flex items-center gap-4 p-4 bg-slate-50 rounded-2xl border border-slate-100">
                                            <span className="text-xl">🏃</span>
                                            <span className="font-medium">3. กระทำ (Executing)</span>
                                        </div>
                                    </div>
                                </div>
                                <button onClick={() => setActiveTab('omission')} className="w-full bg-slate-800 text-white py-4 rounded-2xl font-bold transition-all hover:bg-black">
                                    บทเรียนถัดไป ➡️
                                </button>
                            </div>
                        );

                    case 'omission':
                        return (
                            <div className="space-y-6 p-8 animate-fade-in overflow-y-auto">
                                <h2 className="text-2xl font-bold text-indigo-900">งดเว้น vs ละเว้น</h2>
                                <div className="grid gap-4">
                                    <div className="bg-white p-6 rounded-3xl border border-rose-100">
                                        <h3 className="font-bold text-rose-600 mb-2">● การงดเว้น</h3>
                                        <p className="text-sm text-slate-600">นิ่งเฉยในหน้าที่เฉพาะ (เช่น พ่อแม่) <br/>**โทษหนักเท่าลงมือทำเอง**</p>
                                    </div>
                                    <div className="bg-white p-6 rounded-3xl border border-emerald-100">
                                        <h3 className="font-bold text-emerald-600 mb-2">● การละเว้น</h3>
                                        <p className="text-sm text-slate-600">นิ่งเฉยในหน้าที่พลเมืองดีทั่วไป <br/>**โทษลหุโทษ (โทษเบา)**</p>
                                    </div>
                                </div>
                                <button onClick={() => setActiveTab('quiz')} className="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-xl">
                                    เริ่มทำแบบทดสอบ ⚔️
                                </button>
                            </div>
                        );

                    case 'quiz':
                        const quiz = quizData[currentQuiz];
                        return (
                            <div className="p-8 animate-fade-in">
                                <div className="flex justify-between items-center mb-8">
                                    <span className="text-xs font-bold uppercase tracking-widest text-slate-400">Case {currentQuiz + 1} / 3</span>
                                    <div className="px-4 py-1 bg-indigo-50 text-indigo-600 rounded-full text-xs font-bold">Score: {score}</div>
                                </div>
                                <div className="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100 mb-8">
                                    <p className="text-lg font-medium text-slate-800 leading-relaxed">{quiz.question}</p>
                                </div>
                                {!showAnswer ? (
                                    <div className="space-y-3">
                                        {quiz.options.map((opt, i) => (
                                            <button key={i} onClick={() => handleAnswer(opt.correct)} className="btn-minimal w-full text-left p-5 rounded-2xl bg-white hover:bg-indigo-50 hover:border-indigo-200 text-slate-700 font-medium">
                                                {opt.text}
                                            </button>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="bg-indigo-900 p-8 rounded-[2rem] text-white animate-fade-in">
                                        <div className="flex items-center gap-2 mb-4">
                                            <Icon name="CheckCircle" size={20} className="text-emerald-400" />
                                            <p className="font-bold">คำวินิจฉัย</p>
                                        </div>
                                        <p className="text-indigo-100 font-light leading-relaxed mb-8">{quiz.options.find(o => o.correct).reason}</p>
                                        <button onClick={nextQuiz} className="w-full bg-white text-indigo-900 py-4 rounded-2xl font-bold shadow-lg active:scale-95 transition-all">
                                            คดีต่อไป ➡️
                                        </button>
                                    </div>
                                )}
                            </div>
                        );

                    case 'summary':
                        return (
                            <div className="text-center p-12 space-y-8 animate-fade-in">
                                <div className="relative inline-block">
                                    <div className="absolute inset-0 bg-yellow-400 blur-2xl opacity-20 rounded-full"></div>
                                    <Icon name="Trophy" size={100} className="mx-auto text-yellow-500 relative" />
                                </div>
                                <div>
                                    <h2 className="text-3xl font-bold text-slate-800 mb-2">จบคดีความ</h2>
                                    <p className="text-slate-500">คุณทำคะแนนได้ {score} จาก 3 คะแนน</p>
                                </div>
                                <button onClick={() => {setScore(0); setCurrentQuiz(0); setShowAnswer(false); setActiveTab('intro');}} className="bg-slate-800 text-white px-10 py-4 rounded-2xl font-bold shadow-lg active:scale-95 transition-all">
                                    เริ่มใหม่อีกครั้ง 🔄
                                </button>
                            </div>
                        );
                    default: return null;
                }
            };

            return (
                <div className="min-h-screen flex flex-col max-w-lg mx-auto bg-white shadow-2xl relative">
                    <nav className="bg-white/80 backdrop-blur-md p-6 sticky top-0 z-50 flex justify-between items-center border-b border-slate-50">
                        <div className="flex items-center gap-3 font-bold text-slate-800">
                            <Icon name="BookOpen" size={22} className="text-indigo-600" />
                            <span className="text-sm tracking-tight">Criminal Law Academy</span>
                        </div>
                    </nav>
                    
                    <main className="flex-1 overflow-hidden">{renderContent()}</main>
                    
                    <footer className="p-6 bg-slate-50/50 flex justify-around border-t border-slate-100">
                        <button onClick={() => setActiveTab('intro')} className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'intro' ? 'text-indigo-600 scale-110' : 'text-slate-400'}`}>
                            <Icon name="Home" size={20} />
                            <span className="text-[10px] font-bold uppercase tracking-tighter">หน้าแรก</span>
                        </button>
                        <button onClick={() => setActiveTab('quiz')} className={`flex flex-col items-center gap-1 transition-all
