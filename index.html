<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Law Game - Nattapon Buathong</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap');
        
        body { 
            font-family: 'Prompt', sans-serif; 
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent; 
        }

        .page { display: none; animation: fadeIn 0.4s ease-out; }
        .page.active { display: flex; }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .law-card {
            background: white;
            border-radius: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid #f1f5f9;
        }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen">

    <div id="app-container" class="w-full max-w-lg bg-white min-h-screen shadow-2xl flex flex-col relative">
        
        <nav class="p-6 border-b border-slate-50 flex items-center gap-3">
            <span class="text-indigo-600">⚖️</span>
            <span class="text-sm font-bold text-slate-800 tracking-tight">Criminal Law Academy</span>
        </nav>

        <div id="page-intro" class="page active flex-col items-center justify-center p-12 text-center space-y-8 flex-1">
            <div class="w-24 h-24 bg-indigo-600 rounded-3xl flex items-center justify-center shadow-xl rotate-3">
                <span class="text-4xl text-white">🔨</span>
            </div>
            <div>
                <h1 class="text-3xl font-bold text-slate-800 mb-2">ศาลอาญาคาเฟ่</h1>
                <p class="text-slate-500 font-light italic">โดยคุณ ณัฐพล บัวทอง</p>
            </div>
            <button onclick="showPage('page-lesson')" class="bg-indigo-600 text-white font-semibold py-4 px-10 rounded-2xl shadow-lg active:scale-95 transition-all">
                เริ่มเรียนรู้
            </button>
        </div>

        <div id="page-lesson" class="page flex-col p-8 space-y-6 flex-1">
            <h2 class="text-2xl font-bold text-indigo-900 flex items-center gap-2">🧠 หลักการกระทำ</h2>
            <div class="law-card p-8 space-y-4">
                <p class="text-slate-600 leading-relaxed">การกระทำทางกฎหมายอาญาต้องครบ **3 องค์ประกอบ**:</p>
                <div class="space-y-3">
                    <div class="p-4 bg-slate-50 rounded-2xl border border-slate-100 font-medium">💭 1. คิด (Thinking)</div>
                    <div class="p-4 bg-slate-50 rounded-2xl border border-slate-100 font-medium">💡 2. ตกลงใจ (Deciding)</div>
                    <div class="p-4 bg-slate-50 rounded-2xl border border-slate-100 font-medium">🏃 3. กระทำ (Executing)</div>
                </div>
            </div>
            <button onclick="showPage('page-quiz')" class="w-full bg-slate-800 text-white py-4 rounded-2xl font-bold">เริ่มทำแบบทดสอบ ➡️</button>
        </div>

        <div id="page-quiz" class="page flex-col p-8 flex-1">
            <div class="flex justify-between items-center mb-8">
                <span id="quiz-header" class="text-xs font-bold text-slate-400 uppercase tracking-widest">Case 1 / 3</span>
                <div id="score-badge" class="px-4 py-1 bg-indigo-50 text-indigo-600 rounded-full text-xs font-bold">Score: 0</div>
            </div>
            <div class="law-card p-8 mb-8">
                <p id="question-text" class="text-lg font-medium text-slate-800 leading-relaxed"></p>
            </div>
            <div id="options-container" class="space-y-3">
                </div>
            <div id="feedback-container" class="hidden mt-6 bg-indigo-900 p-8 rounded-[2rem] text-white">
                <p id="feedback-text" class="text-indigo-100 font-light mb-8"></p>
                <button onclick="nextQuestion()" class="w-full bg-white text-indigo-900 py-4 rounded-2xl font-bold">ถัดไป ➡️</button>
            </div>
        </div>

        <div id="page-result" class="page flex-col items-center justify-center p-12 text-center space-y-8 flex-1">
            <div class="text-8xl">🏆</div>
            <div>
                <h2 class="text-3xl font-bold text-slate-800 mb-2">จบคดีความ</h2>
                <p id="final-score-text" class="text-slate-500"></p>
            </div>
            <button onclick="location.reload()" class="bg-slate-800 text-white px-10 py-4 rounded-2xl font-bold shadow-lg">เริ่มใหม่อีกครั้ง 🔄</button>
        </div>

        <footer class="p-6 bg-slate-50/50 flex justify-around border-t border-slate-100 mt-auto">
            <button onclick="showPage('page-intro')" class="text-slate-400 hover:text-indigo-600 flex flex-col items-center gap-1">
                <span class="text-xl">🏠</span>
                <span class="text-[10px] font-bold uppercase">หน้าแรก</span>
            </button>
            <button onclick="showPage('page-quiz')" class="text-slate-400 hover:text-indigo-600 flex flex-col items-center gap-1">
                <span class="text-xl">⚖️</span>
                <span class="text-[10px] font-bold uppercase">ทดสอบ</span>
            </button>
        </footer>
    </div>

    <script>
        // ข้อมูลควิซ
        const quizData = [
            {
                q: "แดงนอนละเมอถีบภรรยาตกเตียงแขนหัก โดยที่แดงไม่เคยรู้มาก่อนว่าตนเองมีอาการนี้",
                options: [
                    { t: "ผิดฐานทำร้ายร่างกาย", c: false, r: "ไม่ใช่! เพราะขาดองค์ประกอบ 'การกระทำ' (ไม่ได้คิดและตกลงใจ)" },
                    { t: "ไม่ผิดเลย เพราะไม่มีการกระทำ", c: true, r: "ถูกต้อง! การละเมอโดยไม่รู้ตัว = ไม่มีการกระทำ" }
                ]
            },
            {
                q: "แดงรู้ตัวว่าเมาแล้วชอบละเมอชกต่อย แต่ก็ยังกินเหล้าแล้วไปนอนข้างดำ สุดท้ายละเมอต่อยดำจริงๆ",
                options: [
                    { t: "ผิด! เพราะรู้ตัวล่วงหน้า (Free in Cause)", c: true, r: "เยี่ยมมาก! แม้ตอนต่อยจะไม่รู้ตัว แต่เหตุเกิดจากการกระทำตอนมีสติ" },
                    { t: "ไม่ผิด เพราะตอนต่อยไม่รู้ตัว", c: false, r: "ผิด! กรณีนี้เข้าข่ายทฤษฎี Free in Cause" }
                ]
            },
            {
                q: "Lifeguard เห็นคนจมน้ำแล้วยืนมองเฉยๆ เพราะหมั่นไส้ (อยากให้ตาย) จนเขาตายจริงๆ",
                options: [
                    { t: "ผิดฐานละเว้น (ลหุโทษ)", c: false, r: "เบาไป! Lifeguard มีหน้าที่เฉพาะ การนิ่งเฉยถือเป็นการฆ่า" },
                    { t: "ผิดฐานฆ่าคนตายโดยเจตนา (งดเว้น)", c: true, r: "ถูกต้อง! นี่คือการ 'งดเว้น' เพราะเขามีหน้าที่ป้องกันผล" }
                ]
            }
        ];

        let currentStep = 0;
        let score = 0;

        // ฟังก์ชันสลับหน้า (แบบรวดเร็ว)
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            if(pageId === 'page-quiz') loadQuestion();
        }

        // ฟังก์ชันโหลดคำถาม
        function loadQuestion() {
            const data = quizData[currentStep];
            document.getElementById('quiz-header').innerText = `Case ${currentStep + 1} / ${quizData.length}`;
            document.getElementById('question-text').innerText = data.q;
            document.getElementById('feedback-container').classList.add('hidden');
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            container.classList.remove('hidden');

            data.options.forEach((opt) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-5 rounded-2xl bg-white border border-slate-100 hover:bg-indigo-50 hover:border-indigo-200 transition-all font-medium text-slate-700 active:scale-95";
                btn.innerText = opt.t;
                btn.onclick = () => checkAnswer(opt.c, opt.r);
                container.appendChild(btn);
            });
        }

        // ตรวจคำตอบ
        function checkAnswer(isCorrect, reason) {
            if (isCorrect) {
                score++;
                document.getElementById('score-badge').innerText = `Score: ${score}`;
            }
            document.getElementById('options-container').classList.add('hidden');
            document.getElementById('feedback-text').innerText = reason;
            document.getElementById('feedback-container').classList.remove('hidden');
        }

        // ไปข้อถัดไป
        function nextQuestion() {
            currentStep++;
            if (currentStep < quizData.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        // หน้าสรุป
        function showResult() {
            showPage('page-result');
            document.getElementById('final-score-text').innerText = `คุณทำคะแนนได้ ${score} จาก ${quizData.length} คะแนน`;
        }
    </script>
</body>
</html>
