<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Law Game - ณัฐพล บัวทอง</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;800&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden">

    <div id="root" class="flex-1 flex flex-col h-full"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- ส่วนสร้างไอคอนเอง (ไม่ต้องพึ่งเว็บนอก กันเว็บพัง) ---
        const IconGavel = ({size=24, className=""}) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m14 13-7.5 7.5c-.83.83-2.17.83-3 0 0 0 0 0 0 0a2.12 2.12 0 0 1 0-3L11 10"/><path d="m16 16 6-6"/><path d="m8 8 6-6"/><path d="m9 7 8 8"/><path d="m21 11-8-8"/></svg>
        );
        const IconTrophy = ({size=24, className=""}) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
        );
        const IconArrowLeft = ({size=24, className=""}) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        );
        const IconChevronRight = ({size=24, className=""}) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m9 18 6-6-6-6"/></svg>
        );

        // --- ส่วนข้อมูลเกม ---
        const gamesDatabase = [
            {
                id: "crim-001",
                category: "กฎหมายอาญา",
                title: "หลักการกระทำ (The Act)",
                description: "คิด > ตกลงใจ > กระทำ (ครบ 3 อย่างถึงผิด)",
                quizzes: [
                    {
                        question: "แดงนอนละเมอถีบภรรยาตกเตียงแขนหัก โดยที่แดงไม่เคยรู้มาก่อนว่าตนเองมีอาการนี้",
                        options: [
                            { text: "ผิดฐานทำร้ายร่างกาย", correct: false, reason: "ไม่ใช่! เพราะขาดองค์ประกอบ 'การกระทำ' (ไม่ได้คิดและตกลงใจ)" },
                            { text: "ไม่ผิดเลย เพราะไม่มีการกระทำ", correct: true, reason: "ถูกต้อง! การละเมอโดยไม่รู้ตัว = ร่างกายเคลื่อนไหวแต่จิตใจไม่ได้สั่ง = ไม่มีการกระทำ" }
                        ]
                    },
                    {
                        question: "แดงรู้ตัวว่าเมาแล้วชอบละเมอชกต่อย แต่ก็ยังกินเหล้าแล้วไปนอนข้างดำ สุดท้ายละเมอต่อยดำจริงๆ",
                        options: [
                            { text: "ผิด! เพราะรู้ตัวล่วงหน้า (Free in Cause)", correct: true, reason: "เยี่ยมมาก! แม้ตอนต่อยจะไม่รู้ตัว แต่เหตุเกิดจากการกระทำตอนมีสติ (กินเหล้า+ไปนอนข้างเขา)" },
                            { text: "ไม่ผิด เพราะตอนต่อยไม่รู้ตัว", correct: false, reason: "ผิด! กรณีนี้เข้าข่ายทฤษฎี Free in Cause (การกระทำโดยอิสระในขณะเป็นต้นเหตุ)" }
                        ]
                    },
                    {
                        question: "Lifeguard เห็นคนจมน้ำแล้วยืนมองเฉยๆ เพราะหมั่นไส้ (อยากให้ตาย) จนเขาตายจริงๆ",
                        options: [
                            { text: "ผิดฐานละเว้น (ลหุโทษ)", correct: false, reason: "เบาไป! Lifeguard มีหน้าที่เฉพาะ การนิ่งเฉยถือเป็นการฆ่า" },
                            { text: "ผิดฐานฆ่าคนตายโดยเจตนา (งดเว้น)", correct: true, reason: "ถูกต้อง! นี่คือการ 'งดเว้น' เพราะเขามีหน้าที่ป้องกันผล การไม่ทำ = การลงมือฆ่า" }
                        ]
                    }
                ]
            }
        ];

        // --- ส่วนระบบเกม ---
        const GameEngine = ({ gameData, onBack }) => {
            const [currentQ, setCurrentQ] = useState(0);
            const [score, setScore] = useState(0);
            const [showAns, setShowAns] = useState(false);
            const [finished, setFinished] = useState(false);

            const handleAnswer = (isCorrect) => {
                setShowAns(true);
                if (isCorrect) setScore(score + 1);
            };

            const next = () => {
                if (currentQ < gameData.quizzes.length - 1) {
                    setCurrentQ(currentQ + 1);
                    setShowAns(false);
                } else {
                    setFinished(true);
                }
            };

            if (finished) return (
                <div className="flex flex-col items-center justify-center h-full p-8 bg-white text-center animate-fade-in">
                    <div className="mb-6"><IconTrophy size={80} className="text-yellow-500 animate-bounce" /></div>
                    <h2 className="text-3xl font-bold text-gray-800 mb-2">จบคดีความ!</h2>
                    <p className="text-xl text-gray-600 mb-8">คุณทำได้ {score} / {gameData.quizzes.length} คะแนน</p>
                    <button onClick={onBack} className="bg-indigo-600 text-white px-10 py-4 rounded-full font-bold shadow-lg">กลับหน้าหลัก</button>
                </div>
            );

            const quiz = gameData.quizzes[currentQ];

            return (
                <div className="flex flex-col h-full bg-gray-50">
                    <div className="bg-white p-4 shadow-sm flex items-center gap-3 sticky top-0 z-10">
                        <button onClick={onBack} className="p-2 bg-gray-100 rounded-full hover:bg-gray-200"><IconArrowLeft size={20}/></button>
                        <div>
                            <h2 className="font-bold text-gray-800">{gameData.title}</h2>
                            <p className="text-xs text-gray-500">ข้อที่ {currentQ + 1}/{gameData.quizzes.length}</p>
                        </div>
                    </div>
                    <div className="p-6 overflow-y-auto pb-24">
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 mb-6">
                            <p className="text-lg font-medium text-gray-800">{quiz.question}</p>
                        </div>
                        {!showAns ? (
                            <div className="space-y-3">
                                {quiz.options.map((opt, i) => (
                                    <button key={i} onClick={() => handleAnswer(opt.correct)} className="w-full text-left p-4 rounded-xl border bg-white shadow-sm hover:bg-indigo-50 font-medium text-gray-700 active:scale-95 transition-transform">
                                        {opt.text}
                                    </button>
                                ))}
                            </div>
                        ) : (
                            <div className={`p-5 rounded-xl border ${quiz.options.find(o=>o.correct).text ? 'bg-green-50 border-green-200' : ''}`}>
                                <div className="font-bold text-green-800 mb-2 flex items-center gap-2"><IconGavel size={18}/> คำตัดสิน:</div>
                                <p className="text-gray-700 mb-4">{quiz.options.find(o=>o.correct).reason}</p>
                                <button onClick={next} className="w-full bg-gray-900 text-white py-3 rounded-xl font-bold">ไปต่อ ➡️</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [selectedGame, setSelectedGame] = useState(null);
            
            if (selectedGame) return <GameEngine gameData={selectedGame} onBack={() => setSelectedGame(null)} />;

            return (
                <div className="flex flex-col h-screen bg-gray-50">
                    <div className="bg-indigo-900 text-white p-8 rounded-b-3xl shadow-lg relative overflow-hidden">
                        <div className="relative z-10">
                            <h1 className="text-3xl font-extrabold mb-1">Law Game</h1>
                            <p className="text-indigo-200 text-sm">โดย ณัฐพล บัวทอง</p>
                        </div>
                        <div className="absolute right-[-10px] top-[20px] text-indigo-800 opacity-50">
                            <IconGavel size={120} />
                        </div>
                    </div>

                    <div className="flex-1 p-6 overflow-y-auto">
                        <h2 className="text-gray-500 font-bold text-sm mb-4 uppercase tracking-wide">คดีที่พร้อมให้เล่น ({gamesDatabase.length})</h2>
                        <div className="space-y-4">
                            {gamesDatabase.map(game => (
                                <button key={game.id} onClick={() => setSelectedGame(game)} className="w-full bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between hover:shadow-md transition-all active:scale-95 text-left group">
                                    <div className="flex items-center gap-4">
                                        <div className="w-12 h-12 rounded-full bg-red-100 flex items-center justify-center text-red-600 text-xl shadow-inner group-hover:scale-110 transition-transform">⚖️</div>
                                        <div>
                                            <h3 className="font-bold text-gray-800 text-lg">{game.title}</h3>
                                            <p className="text-xs text-gray-500">{game.description}</p>
                                        </div>
                                    </div>
                                    <div className="text-gray-300"><IconChevronRight /></div>
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
