<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>สนุกกับประมวลกฎหมายอาญา - Nattapon Buathong</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap');
        
        body { 
            font-family: 'Prompt', sans-serif; 
            background-color: #f8fafc;
            color: #1e293b;
            -webkit-tap-highlight-color: transparent; 
        }

        .screen { display: none; animation: fadeIn 0.3s ease-out; }
        .screen.active { display: flex; }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(5px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .menu-card {
            background: white;
            border-radius: 1rem;
            border: 1px solid #e2e8f0;
            transition: all 0.2s;
        }

        .menu-card:active {
            transform: scale(0.98);
            background-color: #f1f5f9;
        }

        .btn-back {
            color: #64748b;
            font-size: 0.875rem;
            display: flex;
            items-center: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body class="flex justify-center min-h-screen">

    <div id="main-container" class="w-full max-w-md bg-white min-h-screen shadow-xl flex flex-col overflow-x-hidden">
        
        <div id="screen-home" class="screen active flex-col p-8 pt-20 text-center space-y-8">
            <div class="space-y-4">
                <h1 class="text-2xl font-bold text-slate-900 leading-tight">
                    สนุกกับประมวลกฎหมายอาญา : <br>
                    <span class="text-indigo-600">ภาค ๑ บทบัญญัติทั่วไป</span>
                </h1>
                <div class="text-sm text-slate-500">
                    โดย Nattapon Buathong <br>
                    <span class="font-medium text-slate-400">LLB66@STOU</span>
                </div>
            </div>

            <div class="space-y-4 pt-10">
                <button onclick="showScreen('screen-title1')" class="menu-card w-full p-6 text-left flex justify-between items-center group">
                    <div>
                        <div class="text-xs font-bold text-indigo-500 uppercase">ลักษณะ ๑</div>
                        <div class="font-semibold">บทบัญญัติที่ใช้แก่ความผิดทั่วไป</div>
                    </div>
                    <span class="text-slate-300 group-hover:text-indigo-500">➡️</span>
                </button>

                <button onclick="showScreen('screen-title2')" class="menu-card w-full p-6 text-left flex justify-between items-center group">
                    <div>
                        <div class="text-xs font-bold text-slate-400 uppercase">ลักษณะ ๒</div>
                        <div class="font-semibold text-slate-400">บทบัญญัติที่ใช้แก่ความผิดลหุโทษ</div>
                    </div>
                    <span class="text-slate-200">🔒</span>
                </button>
            </div>
        </div>

        <div id="screen-title1" class="screen flex-col p-6 space-y-4">
            <div class="btn-back" onclick="showScreen('screen-home')">⬅️ กลับหน้าหลัก</div>
            <h2 class="text-lg font-bold border-b pb-2 mb-4 text-indigo-900">ลักษณะ ๑ บทบัญญัติที่ใช้แก่ความผิดทั่วไป</h2>
            
            <div class="grid gap-3 overflow-y-auto pb-10">
                <button class="menu-card p-4 text-sm font-medium text-left">หมวด ๑ บทนิยาม</button>
                <button class="menu-card p-4 text-sm font-medium text-left">หมวด ๒ การใช้กฎหมายอาญา</button>
                <button onclick="showScreen('screen-chapter3')" class="menu-card p-4 text-sm font-medium text-left flex justify-between">
                    หมวด ๓ โทษและวิธีเพื่อความปลอดภัย <span>➡️</span>
                </button>
                <button class="menu-card p-4 text-sm font-medium text-left">หมวด ๔ ความรับผิดในทางอาญา</button>
                <button class="menu-card p-4 text-sm font-medium text-left">หมวด ๕ การพยายามกระทำความผิด</button>
                <button class="menu-card p-4 text-sm font-medium text-left">หมวด ๖ ตัวการและผู้สนับสนุน</button>
                <button class="menu-card p-4 text-sm font-medium text-left">หมวด ๗ การกระทำความผิดหลายบทหรือหลายกระทง</button>
                <button class="menu-card p-4 text-sm font-medium text-left">หมวด ๘ การกระทำความผิดอีก</button>
                <button class="menu-card p-4 text-sm font-medium text-left">หมวด ๙ อายุความ</button>
            </div>
        </div>

        <div id="screen-chapter3" class="screen flex-col p-6 space-y-4">
            <div class="btn-back" onclick="showScreen('screen-title1')">⬅️ กลับไปลักษณะ ๑</div>
            <h2 class="text-lg font-bold text-indigo-900">หมวด ๓ โทษและวิธีเพื่อความปลอดภัย</h2>
            
            <div class="space-y-3">
                <button class="menu-card w-full p-5 text-left bg-slate-50 border-dashed">
                    <div class="text-xs text-indigo-500 font-bold">ส่วนที่ ๑</div>
                    <div class="font-semibold text-sm">โทษ</div>
                </button>
                <button class="menu-card w-full p-5 text-left bg-slate-50 border-dashed">
                    <div class="text-xs text-indigo-500 font-bold">ส่วนที่ ๒</div>
                    <div class="font-semibold text-sm">วิธีการเพื่อความปลอดภัย</div>
                </button>
                <button class="menu-card w-full p-5 text-left bg-slate-50 border-dashed">
                    <div class="text-xs text-indigo-500 font-bold">ส่วนที่ ๓</div>
                    <div class="font-semibold text-sm">วิธีเพิ่มโทษ ลดโทษ และการรอการลงโทษ</div>
                </button>
            </div>
        </div>

        <div id="screen-title2" class="screen flex-col p-6 space-y-4">
            <div class="btn-back" onclick="showScreen('screen-home')">⬅️ กลับหน้าหลัก</div>
            <h2 class="text-lg font-bold text-slate-800">ลักษณะ ๒ บทบัญญัติที่ใช้แก่ความผิดลหุโทษ</h2>
            <div class="bg-slate-50 p-10 rounded-2xl text-center border-2 border-dashed border-slate-200">
                <p class="text-slate-400 text-sm italic">Coming Soon... <br> (รอใส่เกมส์)</p>
            </div>
        </div>

    </div>

    <script>
        // ฟังก์ชันสำหรับเปลี่ยนหน้า
        function showScreen(screenId) {
            // ซ่อนทุกหน้า
            document.querySelectorAll('.screen').forEach(s => {
                s.classList.remove('active');
            });
            // แสดงหน้าจอที่เลือก
            document.getElementById(screenId).classList.add('active');
            // เลื่อนขึ้นบนสุดอัตโนมัติ
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
