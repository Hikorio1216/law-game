<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap');
        
        body { 
            font-family: 'Prompt', sans-serif; 
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent; 
        }

        .view { display: none; animation: fadeIn 0.3s ease-out; }
        .view.active { display: flex; }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .menu-card {
            background: white;
            border-radius: 1.5rem;
            transition: all 0.2s ease;
            border: 1px solid #f1f5f9;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .menu-card:active { transform: scale(0.97); background-color: #f1f5f9; }
        
        .breadcrumb { font-size: 0.75rem; color: #94a3b8; margin-bottom: 0.5rem; }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen">

                </div>

            <button onclick="alert('หมวด ๗: รอใส่เกม')" class="menu-card w-full p-4 flex items-center justify-between text-sm font-medium text-slate-700">

                <div>
                    <h3 class="font-bold text-slate-800 text-sm">ส่วนที่ ๒ วิธีการเพื่อความปลอดภัย</h3>

                <div>

                    <p class="text-[10px] text-slate-400">มาตรา ๕๑ - ๕๘</p>
                </div>
            </button>
        </div>

        <footer class="mt-auto p-6 bg-slate-50 text-center border-t border-slate-100">
            <p class="text-[10px] text-slate-400 uppercase tracking-widest font-bold">Enjoy Learning Thai Criminal Law</p>
        </footer>
    </div>

    <script>
        // ฟังก์ชันสลับหน้าจอ (Navigation)
        function showView(viewId) {
            // ซ่อนทุกหน้า
            document.querySelectorAll('.view').forEach(view => {
                view.classList.remove('active');
            });
            // แสดงหน้าที่เลือก
            document.getElementById(viewId).classList.add('active');
            // เลื่อนขึ้นไปบนสุด
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
