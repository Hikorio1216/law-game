<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Law Game - ณัฐพล บัวทอง</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;800&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
        .hidden { display: none; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden">

    <div id="lobby-page" class="flex flex-col h-full overflow-hidden">
        <div class="bg-indigo-900 text-white p-8 rounded-b-3xl shadow-lg relative overflow-hidden">
            <div class="relative z-10">
                <h1 class="text-3xl font-extrabold mb-1">Law Game</h1>
                <p class="text-indigo-200 text-sm">โดย ณัฐพล บัวทอง</p>
            </div>
        </div>
        <div class="flex-1 p-6 overflow-y-auto">
            <h2 class="text-gray-500 font-bold text-sm mb-4 uppercase tracking-wide">เนื้อหาและความสนุก (1)</h2>
            <div id="game-list" class="space-y-4">
                <button onclick="startGame()" class="w-full bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between active:scale-95 transition-all text-left">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-full bg-red-100 flex items-center justify-center text-red-600 text-xl shadow-inner">⚖️</div>
                        <div>
                            <h3 class="font-bold text-gray-800 text-lg">หลักการกระทำ (The Act)</h3>
                            <p class="text-xs text-gray-500">คิด > ตกลงใจ > กระทำ</p>
                        </div>
                    </div>
                    <span class="text-gray-300">➡️</span>
                </button>
            </div>
        </div>
    </div>

    <div id="game-page" class="hidden flex flex-col h-full overflow-hidden bg-gray-50">
        <div class="bg-white p-4 shadow-sm flex items-center gap-3">
            <button onclick="goBack()" class="p-2 bg-gray-100 rounded-full">⬅️</button>
            <div>
                <h2 id="game-title" class="font-bold text-gray-800">หลักการกระทำ</h2>
                <p id="quiz-progress" class="text-xs text-gray-500">ข้อที่ 1/3</p>
            </div>
        </div>
        <div class="p-6 overflow-y-auto pb-24">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 mb-6">
                <p id="question-text" class="text-lg font-medium text-gray-800">คำถามจะแสดงที่นี่</p>
            </div>
            <div id="options-container" class="space-y-3">
                </div>
            <div id="answer-feedback" class="hidden mt-6 p-5 rounded-xl border">
                <p id="feedback-text" class="text-gray-700 mb-4"></p>
                <button id="next-btn" onclick="nextQuestion()" class="w-full bg-gray-900 text-white py-3 rounded-xl font-bold">ไปต่อ ➡️</button>
            </div>
        </div>
    </div>

    <div id="result-page" class="hidden flex flex-col items-center justify-center h-full p-8 bg-white text-center">
        <div class="text-6xl mb-6">🏆</div>
        <h2 class="text-3xl font-bold text-gray-800 mb-2">จบคดีความ!</h2>
        <p id="final-score" class="text-xl text-gray-600 mb-8"></p>
        <button onclick="goBack()" class="bg-indigo-600 text-white px-10 py-4 rounded-full font-bold shadow-lg">กลับหน้าหลัก</button>
    </div>

    <script>
        const quizData = [
            {
                q: "แดงนอนละเมอถีบภรรยาตกเตียงแขนหัก โดยที่แดงไม่เคยรู้มาก่อนว่าตนเองมีอาการนี้",
                options: [
                    { t: "ผิดฐานทำร้ายร่างกาย", c: false, r: "ไม่ใช่! เพราะขาดองค์ประกอบ 'การกระทำ'" },
                    { t: "ไม่ผิดเลย เพราะไม่มีการกระทำ", c: true, r: "ถูกต้อง! การละเมอโดยไม่รู้ตัว = ไม่มีการกระทำ" }
                ]
            },
            {
                q: "แดงรู้ตัวว่าเมาแล้วชอบละเมอชกต่อย แต่ก็ยังกินเหล้าแล้วไปนอนข้างดำ สุดท้ายละเมอต่อยดำจริงๆ",
                options: [
                    { t: "ผิด! เพราะรู้ตัวล่วงหน้า (Free in Cause)", c: true, r: "เยี่ยมมาก! แม้ตอนต่อยจะไม่รู้ตัว แต่เหตุเกิดจากการกระทำตอนมีสติ" },
                    { t: "ไม่ผิด เพราะตอนต่อยไม่รู้ตัว", c: false, r: "ผิด! กรณีนี้เข้าข่ายทฤษฎี Free in Cause" }
                ]
            },
            {
                q: "Lifeguard เห็นคนจมน้ำแล้วยืนมองเฉยๆ เพราะหมั่นไส้จนเขาตายจริงๆ",
                options: [
                    { t: "ผิดฐานละเว้น (ลหุโทษ)", c: false, r: "เบาไป! Lifeguard มีหน้าที่เฉพาะ การนิ่งเฉยถือเป็นการฆ่า" },
                    { t: "ผิดฐานฆ่าคนตายโดยเจตนา (งดเว้น)", c: true, r: "ถูกต้อง! นี่คือการ 'งดเว้น' เพราะเขามีหน้าที่ป้องกันผล" }
                ]
            }
        ];

        let currentStep = 0;
        let score = 0;

        function startGame() {
            document.getElementById('lobby-page').classList.add('hidden');
            document.getElementById('game-page').classList.remove('hidden');
            currentStep = 0;
            score = 0;
            showQuestion();
        }

        function showQuestion() {
            const data = quizData[currentStep];
            document.getElementById('quiz-progress').innerText = `ข้อที่ ${currentStep + 1}/${quizData.length}`;
            document.getElementById('question-text').innerText = data.q;
            document.getElementById('answer-feedback').classList.add('hidden');
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            container.classList.remove('hidden');

            data.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl border bg-white shadow-sm hover:bg-gray-50 font-medium text-gray-700 active:scale-95 transition-all";
                btn.innerText = opt.t;
                btn.onclick = () => handleAnswer(opt.c, opt.r);
                container.appendChild(btn);
            });
        }

        function handleAnswer(isCorrect, reason) {
            if (isCorrect) score++;
            document.getElementById('options-container').classList.add('hidden');
            const feedback = document.getElementById('answer-feedback');
            feedback.classList.remove('hidden');
            feedback.className = `mt-6 p-5 rounded-xl border ${isCorrect ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}`;
            document.getElementById('feedback-text').innerText = reason;
        }

        function nextQuestion() {
            currentStep++;
            if (currentStep < quizData.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('game-page').classList.add('hidden');
            document.getElementById('result-page').classList.remove('hidden');
            document.getElementById('final-score').innerText = `คุณทำได้ ${score} / ${quizData.length} คะแนน`;
        }

        function goBack() {
            document.getElementById('game-page').classList.add('hidden');
            document.getElementById('result-page').classList.add('hidden');
            document.getElementById('lobby-page').classList.remove('hidden');
        }
    </script>
</body>
</html>
